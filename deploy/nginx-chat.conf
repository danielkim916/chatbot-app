server {
    listen 443 ssl;
    server_name chat.jawon.kim;
    root /home/danielkim/chatbot-app/frontend/dist;

    ssl_certificate /etc/letsencrypt/live/chat.jawon.kim/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.jawon.kim/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 128k;

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name chat.jawon.kim;
    return 301 https://chat.jawon.kim$request_uri;
}
